<!doctype html><html><body style="margin:0;background:#111">
<script type="importmap">{"imports":{"three":"./three/build/three.module.js","three/addons/":"./three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
const q=new URLSearchParams(location.search); const which=q.get('s')||'pipeline';
const W=+(q.get('w')||1600), H=+(q.get('h')||1200);
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
r.setSize(W,H); r.setPixelRatio(1); r.shadowMap.enabled=true; r.shadowMap.type=THREE.VSMShadowMap;
r.toneMapping=THREE.ACESFilmicToneMapping; r.toneMappingExposure=1.0; r.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(r.domElement);
const s=new THREE.Scene(); const pm=new THREE.PMREMGenerator(r); s.environment=pm.fromScene(new RoomEnvironment(),0.04).texture;
const cam=new THREE.PerspectiveCamera(30,W/H,0.1,100);
const MINT=0x7CFFC4;
function bg(hex){s.background=new THREE.Color(hex); s.fog=new THREE.Fog(hex,9,22); const f=new THREE.Mesh(new THREE.PlaneGeometry(80,80),new THREE.MeshStandardMaterial({color:hex,roughness:1})); f.rotation.x=-Math.PI/2; f.receiveShadow=true; s.add(f); return f;}
function key(x,y,z,i=2.2){const l=new THREE.DirectionalLight(0xffffff,i); l.position.set(x,y,z); l.castShadow=true; l.shadow.mapSize.set(2048,2048); l.shadow.radius=12; l.shadow.blurSamples=20; const c=l.shadow.camera; c.left=c.bottom=-6; c.right=c.top=6; s.add(l); return l;}
const graphite=new THREE.MeshPhysicalMaterial({color:0x2a2c31,roughness:0.55,metalness:0.1,clearcoat:0.3});
const bone=new THREE.MeshPhysicalMaterial({color:0xd9d5cc,roughness:0.85});
const mintGlass=new THREE.MeshPhysicalMaterial({color:MINT,roughness:0.08,transmission:0.9,thickness:1.2,ior:1.4,attenuationColor:new THREE.Color(0x3fd99a),attenuationDistance:1.5});
const mintEm=new THREE.MeshStandardMaterial({color:MINT,emissive:MINT,emissiveIntensity:2.2});
if(which==='pipeline'){
  bg(0xE4E1DA); key(4,8,5); s.add(new THREE.AmbientLight(0xffffff,0.3));
  for(let i=0;i<9;i++){const g=new RoundedBoxGeometry(3.2,0.12,2.0,4,0.05); const m=new THREE.Mesh(g,i===8?mintGlass:graphite); m.position.set(i*0.06-0.2,0.2+i*0.16,0); m.rotation.y=-0.5+i*0.09; m.rotation.z=0.02*i; m.castShadow=m.receiveShadow=true; s.add(m);
    if(i===8){const e=new THREE.Mesh(new THREE.BoxGeometry(3.22,0.02,0.02),mintEm); e.position.copy(m.position); e.position.z+=0; e.rotation.copy(m.rotation); e.translateZ(1.0); s.add(e);} }
  cam.position.set(5.5,4.2,6.5); cam.lookAt(0.2,0.8,0);
}
if(which==='billing'){
  bg(0x17181B); key(-3,7,4,2.6); const rim=new THREE.PointLight(MINT,30,10); rim.position.set(2,2,-2); s.add(rim);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(1.4,0.42,64,160),bone); ring.position.y=1.82; ring.rotation.y=0.5; ring.castShadow=ring.receiveShadow=true; s.add(ring);
  const sp=new THREE.Mesh(new THREE.SphereGeometry(0.5,64,64),new THREE.MeshPhysicalMaterial({color:MINT,roughness:0.1,clearcoat:1,emissive:0x1c5c44,emissiveIntensity:0.4})); sp.position.set(0.15,0.5,0.1); sp.castShadow=true; s.add(sp);
  cam.position.set(0.8,3.0,11); cam.lookAt(0,1.5,0);
}
if(which==='forecast'){
  bg(0xE2DFD8); r.toneMappingExposure=0.82; key(5,9,3,1.8); s.add(new THREE.AmbientLight(0xffffff,0.25));
  const g=new RoundedBoxGeometry(0.42,1,0.42,3,0.04);
  for(let x=-6;x<=6;x++)for(let z=-5;z<=3;z++){const hgt=0.25+Math.max(0,Math.sin(x*0.5+z*0.3)*0.35+ (x>0? x*0.07:0))+(Math.abs((x*7+z*3)%5)===0?0.3:0); const m=new THREE.Mesh(g,bone); m.scale.y=hgt; m.position.set(x*0.5,hgt/2,z*0.5); m.castShadow=m.receiveShadow=true; s.add(m);}
  const t=new THREE.Mesh(new RoundedBoxGeometry(0.42,2.6,0.42,3,0.04),mintGlass); t.position.set(2.5,1.3,-0.5); t.castShadow=true; s.add(t);
  cam.position.set(6,5.5,7); cam.lookAt(0.6,0.4,-0.6);
}
if(which==='renewals'||which==='cover'){
  bg(0x0F1012); key(-4,6,5,2.0); const p=new THREE.PointLight(MINT,25,8); p.position.set(0,1.6,1.5); s.add(p);
  const mk=(rx,ry,y)=>{const m=new THREE.Mesh(new THREE.TorusGeometry(1.3,0.28,64,200,Math.PI),graphite); m.rotation.set(rx,ry,0); m.position.y=y; m.castShadow=true; s.add(m); return m;};
  mk(0,0.4,0.28); mk(0,-0.9,0.28).position.x=0.7;
  const tube=new THREE.Mesh(new THREE.TorusGeometry(1.02,0.012,8,200,Math.PI*0.8),mintEm); tube.rotation.set(0,0.4,Math.PI*0.1); tube.position.y=0.28; tube.position.z=0.01; s.add(tube);
  cam.position.set(0.4,1.4,7); cam.lookAt(0.3,1.1,0);
}
r.render(s,cam); window.DONE=true;
</script></body></html>
